<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><title>Os meus jogos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f4f7;--sf:#fff;--tx:#1b1b22;--mu:#6b6b78;--ac:#5b5bf0;--bd:#e0e0e8;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121218;--sf:#1d1d27;--tx:#ececf2;--mu:#9a9aab;--ac:#8b8bff;--bd:#2d2d3b;--ok:#4cd488}}
:root[data-theme="dark"]{--bg:#121218;--sf:#1d1d27;--tx:#ececf2;--mu:#9a9aab;--ac:#8b8bff;--bd:#2d2d3b;--ok:#4cd488}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 10px}h2{font-size:16px;margin:22px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab,button,select,input{font:inherit}
.tab{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:7px 12px;border-radius:99px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;font:inherit}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.row>input[type=text]{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{cursor:pointer}
.cv{aspect-ratio:3/4;border-radius:10px;background:var(--sf);border:1px solid var(--bd);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--mu);font-weight:600;position:relative}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:6px;top:6px;background:#000b;color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;z-index:1}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 4px 14px #0006;cursor:pointer;z-index:20}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;background:var(--sf);font-size:13px}.chip .x{font-size:15px;padding:0}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.hs .card{width:130px;flex:none}
.ct{font-size:13px;margin-top:4px;font-weight:600}.cs{font-size:12px;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.top{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.top .cv{width:200px;flex:none;cursor:pointer}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fl label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
a.l{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:7px 11px;color:var(--ac);text-decoration:none;background:var(--sf)}
.tr{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.tr.d span.n{text-decoration:line-through;color:var(--mu)}.tr span.n{flex:1}
.tg{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:0 5px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
</style></head><body><div id="app"></div>
<script>
const PL=['PS1','PS2','PS3','PS4','PS5','PSP','Vita','NES','SNES','N64','GameCube','Wii','Wii U','Switch','Switch 2','Game Boy','GBC','GBA','DS','3DS','Master System','Mega Drive','Saturn','Dreamcast','Xbox','Xbox 360','Xbox One','Xbox Series','PC','Mobile','Arcade','Outra'],TP=['PS3','PS4','PS5','Vita','Xbox 360','Xbox One','Xbox Series','PC'];
const LS={played:'Jogados',playing:'A jogar',want:'Por jogar',dropped:'Desistidos',wish:'Wishlist'};
const TY={platina:'🏆 Platina',ouro:'🥇 Ouro',prata:'🥈 Prata',bronze:'🥉 Bronze'};
let S={games:[],tab:'all',plat:'',view:'inicio',open:null,dlc:null},db=null,ref=null,assets=null,mode='local',tm;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=()=>Math.random().toString(36).slice(2,9),q=encodeURIComponent;
const game=()=>S.games.find(g=>g.id===S.open),cur=()=>{const g=game();return S.dlc?g.dlcs.find(d=>d.id===S.dlc):g};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('gt_cfg')||'{}')}catch(e){return {}}};
const setCfg=o=>localStorage.setItem('gt_cfg',JSON.stringify({...cfg(),...o}));
const PM={'PlayStation 5':'PS5','PlayStation 4':'PS4','PlayStation 3':'PS3','PlayStation 2':'PS2','PlayStation':'PS1','PSP':'PSP','PS Vita':'Vita','Nintendo Switch':'Switch','Nintendo Switch 2':'Switch 2','NES':'NES','SNES':'SNES','Nintendo 64':'N64','GameCube':'GameCube','Wii':'Wii','Wii U':'Wii U','Game Boy':'Game Boy','Game Boy Color':'GBC','Game Boy Advance':'GBA','Nintendo DS':'DS','Nintendo 3DS':'3DS','SEGA Master System':'Master System','SEGA Genesis':'Mega Drive','SEGA Saturn':'Saturn','Dreamcast':'Dreamcast','Xbox':'Xbox','Xbox 360':'Xbox 360','Xbox One':'Xbox One','Xbox Series S/X':'Xbox Series','PC':'PC','iOS':'Mobile','Android':'Mobile'};
const mp=a=>[...new Set((a||[]).map(x=>PM[x.platform.name]).filter(Boolean))];
async function rawg(path,p){const k=cfg().rawg;if(!k)throw new Error('nokey');const u=new URL('https://api.rawg.io/api/'+path);u.searchParams.set('key',k);Object.entries(p||{}).forEach(([a,b])=>u.searchParams.set(a,b));const r=await fetch(u);if(!r.ok)throw new Error('rawg '+r.status);return r.json()}
const gh=(path,o)=>fetch('https://api.github.com'+path,{...o,headers:{Authorization:'Bearer '+cfg().token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
async function push(){const c=cfg();if(!c.token)return;const body={files:{'game-tracker.json':{content:JSON.stringify({games:S.games,sug:S.sug||[]})}}};
 if(c.gist)await gh('/gists/'+c.gist,{method:'PATCH',body:JSON.stringify(body)});else{const j=await (await gh('/gists',{method:'POST',body:JSON.stringify({description:'game-tracker',public:false,...body})})).json();if(j.id)setCfg({gist:j.id})}}
async function pull(){const c=cfg();if(!c.token)return false;let id=c.gist;
 if(!id){const l=await (await gh('/gists?per_page=100')).json();const f=Array.isArray(l)&&l.find(x=>x.files&&x.files['game-tracker.json']);if(!f)return false;id=f.id;setCfg({gist:id})}
 const j=await (await gh('/gists/'+id)).json(),f=j.files&&j.files['game-tracker.json'];if(!f)return false;
 const d=JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content);S.games=d.games||[];S.sug=d.sug||[];locSave();return true}
function locSave(){try{localStorage.setItem('gt',JSON.stringify(S.games));localStorage.setItem('gt_sug',JSON.stringify(S.sug||[]))}catch(e){}}
function save(){clearTimeout(tm);tm=setTimeout(()=>{locSave();push().catch(()=>{})},600)}
async function saveTok(){setCfg({token:ct.value.trim(),gist:''});mode=cfg().token?'cloud':'local';try{const ok=await pull();if(!ok)await push();alert(ok?'Dados carregados do teu gist.':'Sincroniza\u00e7\u00e3o criada.')}catch(e){alert('Erro a sincronizar. Verifica o token (permiss\u00e3o gist).')}render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({games:S.games,sug:S.sug||[]})],{type:'application/json'}));a.download='jogos.json';a.click()}
function impF(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S.games=d.games||[];S.sug=d.sug||[];save();render();alert('Importado.')}catch(e){alert('Ficheiro inv\u00e1lido.')}};r.readAsText(f)}
function cfgHTML(){const c=cfg();return `<h1>\u2699\ufe0f Defini\u00e7\u00f5es</h1><div class="box"><b>Chave RAWG</b> <span class="mu">(gr\u00e1tis em rawg.io/apidocs; fica s\u00f3 neste dispositivo)</span><div class="row"><input type="text" id="ck" value="${E(c.rawg||'')}" placeholder="a tua chave RAWG"><button class="b" onclick="setCfg({rawg:ck.value.trim()});S.news=null;alert('Guardado')">Guardar</button></div></div>
<div class="box" style="margin-top:12px"><b>Sincronizar telem\u00f3vel/PC</b> <span class="mu">(opcional) Token do GitHub com permiss\u00e3o "gist" (github.com/settings/tokens). Os dados ficam num gist privado teu. Usa o mesmo token em cada dispositivo.</span><div class="row"><input type="text" id="ct" value="${E(c.token||'')}" placeholder="ghp_..."><button class="b" onclick="saveTok()">Guardar e sincronizar</button></div></div>
<div class="box" style="margin-top:12px"><b>C\u00f3pia de seguran\u00e7a</b><div class="row"><button class="g" onclick="exp()">Exportar JSON</button><button class="g" onclick="document.getElementById('imp').click()">Importar JSON</button><input type="file" id="imp" accept=".json" style="display:none" onchange="impF(this.files[0])"></div></div>`}
const tried=new Set(),tried2=new Set();
function render(){const y=scrollY,k=S.open+S.dlc;app.innerHTML=S.open?detail():home();if(render.k===k)scrollTo(0,y);else scrollTo(0,0);render.k=k;theme();
 if(S.open&&!S.dlc){const g=game();if(g){if(g.rid&&(g.tags===undefined||g.col===undefined)&&!tried.has(g.id)){tried.add(g.id);refresh(g)}
  if(!g.dc&&!tried2.has(g.id)){tried2.add(g.id);getD(g).then(()=>{save();render()}).catch(()=>{})}}}}
function theme(){const b=document.body.style;b.background='';if(!S.open)return;const g=game();if(!g)return;const c=g.col;
 if(!c){if(g.cover&&!g.ct){g.ct=1;imgCol(g.cover).then(h=>{if(h){g.col=h;save();theme()}})}return}
 const n=parseInt(c,16),r=n>>16&255,gg=n>>8&255,bl=n&255;b.background=`linear-gradient(180deg,rgba(${r},${gg},${bl},.55),rgba(${r},${gg},${bl},0) 560px) no-repeat,var(--bg)`}
function imgCol(u){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(i,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;
 for(let k=0;k<d.length;k+=4){if(Math.max(d[k],d[k+1],d[k+2])-Math.min(d[k],d[k+1],d[k+2])<20)continue;r+=d[k];g+=d[k+1];b+=d[k+2];n++}
 if(!n)return res('');res(((1<<24)+((r/n|0)<<16)+((g/n|0)<<8)+(b/n|0)).toString(16).slice(1))}catch(e){res('')}};i.onerror=()=>res('');i.src=u})}
const pls=g=>g.plats&&g.plats.length?g.plats:[g.platform||'PC'];
const GN={Action:'A\u00e7\u00e3o',Adventure:'Aventura',Strategy:'Estrat\u00e9gia',Simulation:'Simula\u00e7\u00e3o',Platformer:'Plataformas',Racing:'Corrida',Sports:'Desporto',Fighting:'Luta','Massively Multiplayer':'MMO',Family:'Fam\u00edlia'};
const TGW=['FPS','Open World','Souls-like','Co-op','Multiplayer','Horror','Survival','Metroidvania','Roguelike','Story Rich','Third Person','Stealth','Sci-fi','Fantasy','Turn-Based','JRPG'];
function tagsOf(r){const a=(r.genres||[]).map(x=>GN[x.name]||x.name),b=(r.tags||[]).map(x=>x.name).filter(n=>TGW.some(w=>w.toLowerCase()===n.toLowerCase()));return [...new Set([...a,...b])].slice(0,8)}
const RP={'PS5':187,'PS4':18,'PS3':16,'PS2':15,'PS1':27,'PSP':17,'Vita':19,'Switch':7,'NES':49,'SNES':79,'N64':83,'GameCube':105,'Wii':11,'Wii U':10,'Game Boy':26,'GBC':43,'GBA':24,'DS':9,'3DS':8,'Master System':74,'Mega Drive':167,'Saturn':107,'Dreamcast':106,'Xbox':80,'Xbox 360':14,'Xbox One':1,'Xbox Series':186,'PC':4,'Mobile':21};
const RG=[['action','Ação'],['role-playing-games-rpg','RPG'],['shooter','Shooter'],['adventure','Aventura'],['strategy','Estratégia'],['indie','Indie'],['platformer','Plataformas'],['puzzle','Puzzle'],['racing','Corrida'],['sports','Desporto'],['fighting','Luta'],['simulation','Simulação'],['arcade','Arcade'],['massively-multiplayer','MMO'],['casual','Casual'],['family','Família']];
const RT=[['fps','FPS'],['open-world','Open World'],['souls-like','Souls-like'],['co-op','Co-op'],['horror','Horror'],['survival','Survival'],['metroidvania','Metroidvania'],['roguelike','Roguelike'],['jrpg','JRPG']];
const RO=[['-added','Mais populares'],['-metacritic','Melhor Metacritic'],['-released','Mais recentes'],['-rating','Melhor avaliados'],['name','A–Z']];
function home(){if(S.view==='inicio'&&!S.news&&cfg().rawg){S.news='load';loadNews()}
 const t=(v,l)=>`<button class="tab ${(S.view||'inicio')===v?'on':''}" onclick="S.view='${v}';render()">${l}</button>`;
 return `<div class="tabs" style="margin-bottom:8px">${t('inicio','🏠 Início')}${t('lib','📚 Biblioteca')}${t('search','🔎 Pesquisa')}${t('cfg','⚙️')}</div>`+addPanel()+(S.view==='lib'?lib():S.view==='cfg'?cfgHTML():S.view==='search'?searchView():inicio())
 +(S.adding||S.view==='cfg'?'':`<button class="fab" title="Adicionar jogo" onclick="openAdd()">+</button>`)}
function gcard(r,i,own){return `<div class="card" onclick="pickS(${i})"><div class="cv">${r.background_image?`<img loading="lazy" decoding="async" src="${E(r.background_image)}" alt="">`:E(r.name)}${own.has(r.id)?'<span class="badge">✓</span>':''}</div><div class="ct">${E(r.name)}</div><div class="cs">${E((r.released||'').slice(0,4))} · ${E(mp(r.platforms).slice(0,3).join(', '))}</div></div>`}
function searchView(){const f=S.sf=S.sf||{ord:'-added'},own=new Set(S.games.map(g=>g.rid)),
 opt=(a,v,all)=>`<option value="">${all}</option>`+a.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
 return `<h1>🔎 Pesquisa</h1><div class="row"><input type="text" id="sq" style="flex:1" placeholder="Nome (opcional)" value="${E(f.q||'')}" onkeydown="if(event.key==='Enter')runS(true)"></div>
 <div class="row"><select id="sp">${opt(Object.keys(RP).map(k=>[k,k]),f.plat,'Todas as plataformas')}</select><select id="sg">${opt(RG,f.genre,'Todos os géneros')}</select><select id="st">${opt(RT,f.tag,'Todos os tipos')}</select><select id="so">${RO.map(([k,l])=>`<option value="${k}" ${f.ord===k?'selected':''}>${l}</option>`).join('')}</select><button class="b" onclick="runS(true)">Pesquisar</button></div>
 ${S.sbusy&&!(S.sr||[]).length?'<p class="mu">A procurar...</p>':S.sr?`<div class="grid">${S.sr.map((r,i)=>gcard(r,i,own)).join('')}</div>${S.sm?`<div class="row"><button class="g" onclick="runS(false)" ${S.sbusy?'disabled':''}>Ver mais</button></div>`:''}${S.sr.length?'':'<p class="mu">Nada encontrado.</p>'}`:'<p class="mu">Escolhe uma plataforma, um género ou um tipo (ou escreve um nome) e carrega em Pesquisar.</p>'}`}
async function runS(fresh){const f=S.sf=S.sf||{};if(fresh){f.q=sq.value.trim();f.plat=sp.value;f.genre=sg.value;f.tag=st.value;f.ord=so.value;f.page=0;S.sr=[]}
 f.page=(f.page||0)+1;S.sbusy=true;render();
 try{const p={page_size:24,page:f.page,exclude_additions:'true',ordering:f.ord||'-added'};if(f.q)p.search=f.q;if(f.plat)p.platforms=RP[f.plat];if(f.genre)p.genres=f.genre;if(f.tag)p.tags=f.tag;
  if(f.ord==='-metacritic')p.metacritic='1,100';if(f.ord==='-released')p.dates='1970-01-01,'+new Date().toISOString().slice(0,10);
  const d=await rawg('games',p);S.sr=[...(S.sr||[]),...d.results];S.sm=!!d.next}catch(e){S.sm=false;alert(e.message==='nokey'?'Falta a chave RAWG.':'Não consegui pesquisar agora.')}S.sbusy=false;render()}
function pickS(i){const r=S.sr[i],pl=mp(r.platforms),f=S.sf||{};S.adding=true;S.pend={r,plats:f.plat&&pl.includes(f.plat)?[f.plat]:(pl.length===1?[pl[0]]:[]),list:defList()};render();scrollTo(0,0)}
function lib(){
 const own=g=>g.list!=='wish',inTab=g=>S.tab==='all'?own(g):g.list===S.tab,
 gs=S.games.filter(g=>inTab(g)&&(!S.plat||pls(g).includes(S.plat))&&(!S.tag||(g.tags||[]).includes(S.tag))),
 tags=[...new Set(S.games.flatMap(g=>g.tags||[]))].sort(),cnt=k=>k==='all'?S.games.filter(own).length:S.games.filter(g=>g.list===k).length;
 return `<h1>\ud83c\udfae Biblioteca</h1><div class="mu">${mode==='cloud'?'Sincronizado via GitHub Gist':'Guardado s\u00f3 neste dispositivo'}</div>
 <div class="tabs" style="margin-top:8px">${[['all','Os meus jogos'],...Object.entries(LS)].map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${v} (${cnt(k)})</button>`).join('')}</div>
 <div class="row"><select onchange="S.plat=this.value;render()"><option value="">Todas as plataformas</option>${PL.map(p=>`<option ${S.plat===p?'selected':''}>${p}</option>`).join('')}</select>
 <select onchange="S.tag=this.value;render()"><option value="">Todas as tags</option>${tags.map(p=>`<option ${S.tag===p?'selected':''}>${E(p)}</option>`).join('')}</select></div>
 <div class="grid">${gs.map(g=>`<div class="card" onclick="S.open='${g.id}';S.dlc=null;render()"><div class="cv">${g.cover?`<img src="${E(g.cover)}" alt="">`:E(g.title)}${g.rating!==''&&g.rating!=null?`<span class="badge">\u2605 ${E(g.rating)}</span>`:''}</div><div class="ct">${E(g.title)}</div><div class="cs">${E(pls(g).join(' \u00b7 '))}${S.tab==='all'&&LS[g.list]?' \u00b7 '+LS[g.list]:''}</div></div>`).join('')||'<p class="mu">Nada aqui ainda. Usa o bot\u00e3o + para adicionar jogos.</p>'}</div>`}
function openAdd(){S.adding=true;S.pend=null;render();setTimeout(()=>{const n=document.getElementById('nt');n&&n.focus()},50)}
function closeAdd(){S.adding=false;S.pend=null;S.res=null;S.q='';render()}
function addPanel(){if(!S.adding)return '';const pd=S.pend;
 if(pd){const r=pd.r,opts=mp(r.platforms).length?mp(r.platforms):PL;
  return `<div class="box" style="margin-bottom:12px"><div class="row" style="margin-top:0">${r.background_image?`<img src="${E(r.background_image)}" style="width:44px;height:58px;object-fit:cover;border-radius:6px" alt="">`:''}<b>${E(r.name)}</b></div><div class="mu">Em que plataformas?</div><div class="row">${opts.map(p=>`<button class="tab ${pd.plats.includes(p)?'on':''}" onclick="tgP('${p}')">${p}</button>`).join('')}</div>
  <div class="row"><select id="al">${Object.entries(LS).map(([k,v])=>`<option value="${k}" ${pd.list===k?'selected':''}>${v}</option>`).join('')}</select><button class="b" onclick="confirmAdd()">Adicionar</button><button class="g" onclick="S.pend=null;render()">Voltar</button></div></div>`}
 return `<div class="box" style="margin-bottom:12px"><div class="row" style="margin-top:0"><input type="text" id="nt" placeholder="Nome do jogo..." value="${E(S.q||'')}" onkeydown="if(event.key==='Enter')srch()"><button class="b" onclick="srch()">Procurar</button><button class="g" onclick="closeAdd()">\u2715</button></div>${resHTML()}</div>`}
function resHTML(){if(!S.res)return '';if(S.res==='load')return '<div class="mu">A procurar...</div>';
 if(S.res==='nokey')return '<div>Falta a chave RAWG. <button class="g" onclick="closeAdd();S.view=\'cfg\';render()">Abrir definições</button></div>';
 return '<div style="max-height:60vh;overflow:auto">'+(S.res.length?'':'<div class="mu">Nada encontrado.</div>')+S.res.map((r,i)=>`<div class="tr" style="cursor:pointer" onclick="pick(${i})">${r.background_image?`<img src="${E(r.background_image)}" style="width:44px;height:58px;object-fit:cover;border-radius:6px;flex:none" alt="">`:'<div style="width:44px;height:58px;flex:none"></div>'}<span class="n"><b>${E(r.name)}</b> <span class="mu">${E((r.released||'').slice(0,4))} · ${E(mp(r.platforms).join(', '))}</span></span><span>+</span></div>`).join('')+(S.rn?`<div class="row"><button class="g" onclick="moreQ()">Ver mais</button></div>`:'')+'</div>'+`<div class="row"><button class="g" onclick="addTyped()">Adicionar "${E(S.q)}" tal como escrevi</button></div>`}
async function srch(){const q=nt.value.trim();if(!q)return;S.q=q;S.res='load';S.qp=1;render();
 try{const d=await rawg('games',{search:q,page_size:20,exclude_additions:'true'});S.res=d.results;S.rn=!!d.next}catch(e){S.res=e.message==='nokey'?'nokey':[];S.rn=false}render()}
async function moreQ(){S.qp++;try{const d=await rawg('games',{search:S.q,page_size:20,page:S.qp,exclude_additions:'true'});S.res=[...S.res,...d.results];S.rn=!!d.next}catch(e){S.rn=false}render()}
const defList=()=>S.tab==='all'?'want':S.tab;
function pick(i){const r=S.res[i],pl=mp(r.platforms);S.pend={r,plats:pl.length===1?[pl[0]]:[],list:defList()};render()}
function addTyped(){S.pend={r:{name:S.q,platforms:[]},plats:[],list:defList()};render()}
function tgP(p){const a=S.pend.plats,i=a.indexOf(p);i<0?a.push(p):a.splice(i,1);S.pend.list=document.getElementById('al').value;render()}
function confirmAdd(){const pd=S.pend;if(!pd.plats.length){alert('Escolhe pelo menos uma plataforma.');return}
 const g=fromRaw(pd.r,document.getElementById('al').value,pd.plats);S.games.unshift(g);S.adding=false;S.pend=null;S.res=null;S.q='';save();render();
 if(g.rid)enrich(g,true);else getD(g).then(()=>{save();if(!S.open)render()}).catch(()=>{})}
function fromRaw(r,list,plats){return {id:U(),rid:r.id,title:r.name,year:(r.released||'').slice(0,4),plats,platform:plats[0],list,col:r.saturated_color||r.dominant_color||'',cover:r.background_image||'',mcs:r.metacritic||'',genres:(r.genres||[]).map(x=>x.id),tags:tagsOf(r),rating:'',dlcs:[],notes:''}}
function refresh(g){rawg('games/'+g.rid).then(d=>{if(g.tags===undefined)g.tags=tagsOf(d);g.genres=(d.genres||[]).map(x=>x.id);g.mcs=d.metacritic||g.mcs;g.lmc=g.lmc||d.metacritic_url||'';g.col=d.saturated_color||d.dominant_color||'';if(!g.cover)g.cover=d.background_image||'';save();render()}).catch(()=>{})}
function enrich(g,dlcs){tried.add(g.id);refresh(g);if(dlcs)getD(g).then(()=>{save();if(!S.open)render()}).catch(()=>{})}
function addPl(v){if(!v)return;const g=game();g.plats=[...pls(g),v];g.platform=g.plats[0];save();render()}
function rmPl(p){const g=game();g.plats=pls(g).filter(x=>x!==p);g.platform=g.plats[0];save();render()}
function addTag(){const v=document.getElementById('tg').value.trim();if(!v)return;const g=game();g.tags=g.tags||[];if(!g.tags.some(x=>x.toLowerCase()===v.toLowerCase()))g.tags.push(v);save();render()}
function rmTag(i){game().tags.splice(i,1);save();render()}
function yt(s){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(s)}
function strip(l){return l.length?`<div class="hs">${l.map(g=>`<div class="card" onclick="S.open='${g.id}';S.dlc=null;render()"><div class="cv">${g.cover?`<img src="${E(g.cover)}" alt="">`:E(g.title)}${g.rating!==''&&g.rating!=null?`<span class="badge">★ ${E(g.rating)}</span>`:''}</div><div class="ct">${E(g.title)}</div></div>`).join('')}</div>`:'<div class="mu">Nada aqui ainda.</div>'}
function rc(r,i,k){return `<div class="card"><div class="cv">${r.background_image?`<img src="${E(r.background_image)}" alt="">`:E(r.name)}</div><div class="ct">${E(r.name)}</div><div class="cs">${E(r.released||'')}</div><div class="row" style="margin:4px 0"><button class="g" style="padding:3px 8px" onclick="addRaw('${k}',${i})">+ \u2661</button><a class="l" style="padding:3px 8px" target="_blank" rel="noopener" href="${E(yt(r.name+' official trailer'))}">🎬</a></div></div>`}
function rl(k){const n=S.news;if(n==='load'||(!n&&cfg().rawg))return '<div class="mu">A carregar...</div>';if(!cfg().rawg)return '<div class="mu">P\u00f5e a chave RAWG nas defini\u00e7\u00f5es.</div>';if(!n[k])return '<div class="mu">Indispon\u00edvel agora.</div>';return `<div class="hs">${n[k].map((r,i)=>rc(r,i,k)).join('')}</div>`}
async function loadNews(){try{const d=new Date(),f=x=>x.toISOString().slice(0,10),a=new Date(+d-45*864e5),b=new Date(+d+150*864e5),c=new Date(+d+864e5);
 const [n,u]=await Promise.all([rawg('games',{dates:f(a)+','+f(d),ordering:'-added',page_size:12}),rawg('games',{dates:f(c)+','+f(b),ordering:'-added',page_size:12})]);S.news={n:n.results,u:u.results}}catch(e){S.news={}}render()}
function inicio(){
 const G=S.games,pl=G.filter(g=>g.list==='playing'),done=G.filter(g=>g.list==='played'),rated=G.filter(g=>g.rating!==''&&g.rating!=null&&!isNaN(+g.rating)),
 avg=rated.length?(rated.reduce((a,g)=>a+ +g.rating,0)/rated.length).toFixed(1):'\u2013',top=[...rated].sort((a,b)=>b.rating-a.rating).slice(0,8),
 want=G.filter(g=>g.list==='want'),wish=G.filter(g=>g.list==='wish'),nx=G.find(g=>g.id===S.nx);
 return `<h1>🎮 In\u00edcio</h1><div class="fl"><div class="box"><b>${G.length}</b><div class="mu">jogos</div></div><div class="box"><b>${done.length}</b><div class="mu">jogados</div></div><div class="box"><b>${avg}</b><div class="mu">nota m\u00e9dia</div></div><div class="box"><b>${want.length}</b><div class="mu">por jogar</div></div><div class="box"><b>${wish.length}</b><div class="mu">wishlist</div></div></div>
 <h2>A jogar agora</h2>${strip(pl)}
 <h2>Últimos lançamentos</h2>${rl('n')}
 <h2>Pr\u00f3ximos lan\u00e7amentos</h2>${rl('u')}
 <h2>Sugest\u00f5es para ti</h2>${(S.sug||[]).length?`<div class="hs">${S.sug.map((r,i)=>rc(r,i,'s')).join('')}</div>`:'<div class="mu">Baseadas nos g\u00e9neros dos jogos que avaliaste com 7 ou mais.</div>'}<div class="row"><button class="b" onclick="sugg()" ${S.sl?'disabled':''}>${S.sl?'A procurar...':'\u2728 Gerar sugest\u00f5es'}</button></div>
 <h2>Jogar a seguir</h2><div class="box">${nx?strip([nx])+`<a class="l" target="_blank" rel="noopener" href="${E(yt(nx.title+' '+pls(nx)[0]+' official trailer'))}">🎬 Trailer</a>`:''}<div class="row"><button class="g" onclick="pickNext()">🎲 Escolher entre os que tenho por jogar</button></div></div>
 <h2>Os teus melhores</h2>${strip(top)}<h2>Wishlist</h2>${strip(wish)}`}
function pickNext(){const w=S.games.filter(g=>g.list==='want');S.nx=w.length?w[Math.floor(Math.random()*w.length)].id:null;render()}
async function sugg(){const cnt={};S.games.filter(g=>+g.rating>=7).forEach(g=>(g.genres||[]).forEach(x=>cnt[x]=(cnt[x]||0)+1));const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
 if(!top.length){alert('Adiciona jogos pela pesquisa e d\u00e1 nota 7 ou mais a alguns, para eu saber os teus g\u00e9neros.');return}
 S.sl=true;render();try{const r=(await rawg('games',{genres:top.join(','),ordering:'-metacritic',metacritic:'80,100',page_size:40})).results,own=new Set(S.games.map(g=>g.rid)),tt=new Set(S.games.map(g=>g.title.toLowerCase()));
 S.sug=r.filter(x=>!own.has(x.id)&&!tt.has(x.name.toLowerCase())).sort(()=>Math.random()-.5).slice(0,8).map(x=>({id:x.id,name:x.name,released:x.released,background_image:x.background_image,platforms:x.platforms,genres:x.genres,tags:x.tags,metacritic:x.metacritic}))}catch(e){alert(e.message==='nokey'?'Falta a chave RAWG.':'N\u00e3o consegui gerar sugest\u00f5es.')}S.sl=false;save();render()}
function addRaw(k,i){const r=k==='s'?S.sug[i]:S.news[k][i],used=S.games.flatMap(g=>pls(g)),pl=mp(r.platforms),g=fromRaw(r,'wish',[pl.find(x=>used.includes(x))||pl[0]||'PC']);S.games.unshift(g);if(k==='s')S.sug.splice(i,1);save();render();enrich(g,false)}
function setF(k,v){const e=cur();e[k]=v;save();if(k==='title'||k==='platform'||k==='list')render()}
function stats(e){const t=e.trophies||[],d=t.filter(x=>x.done).length,on=t.filter(x=>x.online).length;
 const c=Object.keys(TY).map(k=>[k,t.filter(x=>x.type===k).length]).filter(x=>x[1]).map(x=>`${TY[x[0]].split(' ')[0]} ${x[1]}`).join(' · ');
 return {t:t.length,d,on,c}}
function links(e,g,dlc){const P=pls(g),p=P[0],t=dlc?g.title+' '+e.title:e.title,Q=encodeURIComponent,D=x=>'https://www.google.com/search?q='+Q(x),
 ps=P.find(x=>/^(PS[345]|Vita)$/.test(x)),xb=P.find(x=>/^(Xbox 360|Xbox One|Xbox Series|PC)$/.test(x));
 const L=[['⏱ Quanto tempo demora (HLTB)',e.hltb||D(t+' site:howlongtobeat.com')],['Ⓜ Metacritic',e.lmc||D(t+' '+p+' site:metacritic.com')],
 ['▶ Walkthrough completo',e.lwt||yt(t+' '+p+' full walkthrough')]];
 if(ps)L.push(['🏆 Troféus (PSNProfiles)',e.ltr||D(t+' '+ps+' trophies site:psnprofiles.com')]);
 if(xb)L.push(['🏆 Conquistas (Exophase)',(ps?'':e.ltr)||D(t+' '+xb+' achievements site:exophase.com')]);
 L.push(['📖 Wiki (mapas e guias)',e.wiki||D(t+' wiki')],['🎬 Trailer',e.ltl||yt(t+' '+(dlc?'':p+' ')+'official trailer')]);
 return L.map(x=>`<a class="l" target="_blank" rel="noopener" href="${E(x[1])}">${x[0]}</a>`).join('')}
function detail(){
 const g=game(),e=cur(),dlc=!!S.dlc,cv=e.cover||g.cover;
 return `<div class="row"><button class="g" onclick="${dlc?`S.dlc=null`:`S.open=null`};render()">← ${dlc?E(g.title):'Voltar'}</button>${dlc?'<button class="g" onclick="delD()">Apagar DLC</button>':`<button class="g" onclick="del()">Apagar jogo</button>`}</div>
 <div class="top"><div class="cv" onclick="cover()" title="Mudar capa">${cv?`<img src="${E(cv)}" alt="">`:'Toca para pôr a capa'}</div>
 <div style="flex:1;min-width:200px"><input type="text" style="width:100%;font-size:18px;font-weight:700" value="${E(e.title)}" onchange="setF('title',this.value)">
 ${dlc?`<div class="mu" style="margin-top:6px">DLC de ${E(g.title)}${e.year?' · '+E(e.year):''}</div>`:`<div class="row">${pls(g).map(p=>`<span class="chip">${E(p)}${pls(g).length>1?`<button class="x" onclick="rmPl('${p}')">×</button>`:''}</span>`).join('')}<select onchange="addPl(this.value)"><option value="">+ plataforma</option>${PL.filter(p=>!pls(g).includes(p)).map(p=>`<option>${p}</option>`).join('')}</select></div>
 <div class="row"><select onchange="setF('list',this.value)">${Object.entries(LS).map(([k,v])=>`<option value="${k}" ${g.list===k?'selected':''}>${v}</option>`).join('')}</select></div>`}
 ${g.mcs&&!dlc?`<div class="mu">Metacritic: <b>${E(g.mcs)}</b>${g.year?' · '+E(g.year):''}</div>`:''}
 <label class="mu">A minha nota (0–10)<br><input type="number" min="0" max="10" step="0.5" style="width:90px" value="${E(e.rating)}" onchange="setF('rating',this.value)"></label>
 <textarea style="width:100%;margin-top:8px" rows="3" placeholder="A minha review..." onchange="setF('review',this.value)">${E(e.review)}</textarea></div></div>
 <h2>Links</h2><div class="box"><div class="row" style="margin-top:0">${links(e,g,dlc)}</div>
 <details><summary class="mu">Substituir por links diretos</summary><div class="row">
 <input type="text" placeholder="HowLongToBeat" value="${E(e.hltb)}" onchange="setF('hltb',this.value)"><input type="text" placeholder="Metacritic" value="${E(e.lmc)}" onchange="setF('lmc',this.value)">
 <input type="text" placeholder="Walkthrough" value="${E(e.lwt)}" onchange="setF('lwt',this.value)"><input type="text" placeholder="Troféus/Conquistas" value="${E(e.ltr)}" onchange="setF('ltr',this.value)">
 <input type="text" placeholder="Wiki" value="${E(e.wiki)}" onchange="setF('wiki',this.value)"><input type="text" placeholder="Trailer" value="${E(e.ltl)}" onchange="setF('ltl',this.value)"></div></details></div>
 <h2>Notas</h2><textarea style="width:100%" rows="3" onchange="setF('notes',this.value)">${E(e.notes)}</textarea>
 ${dlc?'':`<h2>DLCs</h2>${g.dlcs.length?`<div class="hs">${g.dlcs.map(d=>`<div class="card" onclick="S.dlc='${d.id}';render()"><div class="cv">${(d.cover||g.cover)?`<img loading="lazy" src="${E(d.cover||g.cover)}" alt="">`:E(d.title)}${d.rating!==''&&d.rating!=null?`<span class="badge">★ ${E(d.rating)}</span>`:''}</div><div class="ct">${E(d.title)}</div></div>`).join('')}</div>`:'<div class="mu">Sem DLCs de história (são procuradas automaticamente).</div>'}
 <h2>Tags</h2><div class="box"><div class="row" style="margin-top:0">${(g.tags||[]).map((t,i)=>`<span class="chip">${E(t)}<button class="x" onclick="rmTag(${i})">×</button></span>`).join('')||'<span class="mu">Sem tags.</span>'}</div><div class="row"><input type="text" id="tg" placeholder="Nova tag (ex.: RPG, FPS)" onkeydown="if(event.key===\'Enter\')addTag()"><button class="b" onclick="addTag()">+</button></div></div>`}`}
async function getD(g){if(!g.rid){const d=await rawg('games',{search:g.title,page_size:1,exclude_additions:'true'});if(!d.results[0])return 0;g.rid=d.results[0].id}
 const d=await rawg('games/'+g.rid+'/additions',{page_size:40}),bad=/\b(skins?|cosmetics?|soundtrack|art ?book|costumes?|outfits?|bundle|deluxe|digital extras?|season pass|upgrade|edition)\b/i;let n=0;
 (d.results||[]).forEach(x=>{if(bad.test(x.name))return;const ex=g.dlcs.find(y=>y.title.toLowerCase()===x.name.toLowerCase());if(ex){if(!ex.cover)ex.cover=x.background_image||'';return}
  g.dlcs.push({id:U(),title:x.name,year:(x.released||'').slice(0,4),cover:x.background_image||'',rating:'',notes:''});n++});g.dc=1;return n}
function delD(){if(confirm('Apagar esta DLC?')){const g=game();g.dlcs=g.dlcs.filter(d=>d.id!==S.dlc);S.dlc=null;save();render()}}
function del(){if(confirm('Apagar este jogo?')){S.games=S.games.filter(g=>g.id!==S.open);S.open=null;save();render()}}
function cover(){const e=cur(),u=prompt('Link da imagem da capa:',e.cover||'');if(u!==null){e.cover=u.trim();save();render()}}
(()=>{try{S.games=JSON.parse(localStorage.getItem('gt')||'[]');S.sug=JSON.parse(localStorage.getItem('gt_sug')||'[]')}catch(e){}
 if(cfg().token)mode='cloud';render();if(cfg().token)pull().then(ok=>{if(ok)render()}).catch(()=>{})})();
</script></body></html>
